; Game Boy / Game Boy Color emulator for M5Stack Cardputer ADV, with the screen streamed to a phone
[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
board_build.f_cpu = 240000000L
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWS_MAX_QUEUED_MESSAGES=2
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DMINIGB_APU_AUDIO_FORMAT_S16SYS
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    ESP32Async/AsyncTCP@^3.4.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
; pio device monitor: every line timestamped and saved to logs/, crash backtraces decoded
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file
